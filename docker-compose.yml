version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: retailsense-db
    restart: always
    environment:
      POSTGRES_USER: retailsense_user
      POSTGRES_PASSWORD: retailsense_password
      POSTGRES_DB: retailsense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailsense_user -d retailsense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailsense-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://retailsense_user:retailsense_password@db:5432/retailsense_db
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retailsense-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
